<!doctype html>
<html lang="en" data-platform-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080b12">
  <title>SAGE Platform Admin</title>
  <script>
    /* PLATFORM LOGIN THEME PRE-PAINT — use the saved console theme before CSS paints. */
    (()=>{try{const colors={dark:'#080b12',light:'#f4f7fb',ocean:'#06121c',emerald:'#07130f',violet:'#100b19',amber:'#171007'},saved=localStorage.getItem('sage-platform-theme')||'dark',theme=Object.prototype.hasOwnProperty.call(colors,saved)?saved:'dark',html=document.documentElement;html.dataset.platformTheme=theme;html.style.backgroundColor=colors[theme];html.style.colorScheme=theme==='light'?'light':'dark';const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute('content',colors[theme]);}catch(_){}})();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/vision.css') }}">
</head>
<body class="platform-admin-body platform-v2 platform-admin-login-page">
  <main class="platform-admin-login-shell">
    <section class="platform-admin-login-frame">
      <aside class="platform-admin-login-visual"><div class="sage-native-brand platform-native-brand"><span class="sage-mark"><i></i></span><span class="sage-wordmark"><b>S</b><b class="sage-a" aria-hidden="true">Λ</b><b>G</b><b>E</b></span></div><div class="platform-admin-visual-orbit"><span class="orbit-core">◇</span><i class="orbit-node node-a">▦</i><i class="orbit-node node-b">₦</i><i class="orbit-node node-c">◉</i><i class="orbit-node node-d">⌁</i></div><div class="platform-admin-visual-strip"><span><i></i>Tenants</span><span><i></i>Finance trace</span><span><i></i>Live activity</span></div></aside>
      <section class="platform-auth-card"><span class="auth-kicker">RESTRICTED PLATFORM ACCESS</span><h1>Developer Console</h1><p>Secure SAGE administration.</p>{% if not configured %}<div class="platform-warning">Add <b>SAGE_ADMIN_USERNAME</b> and <b>SAGE_ADMIN_PASSWORD</b> to your .env file.</div>{% endif %}<form id="platformLoginForm" class="platform-auth-form"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<div class="platform-password-field"><input id="platformAdminPassword" name="password" type="password" autocomplete="current-password" required><button id="platformPasswordToggle" type="button" aria-label="Show password">◉</button></div></label><div class="form-message" id="platformLoginMessage"></div><button class="btn primary platform-auth-submit" type="submit">Open Console <span>→</span></button></form><a class="platform-back-link" href="/login">← Back to SAGE</a><div class="platform-auth-security"><span>Encrypted session</span><span>Rate limited</span><span>Audit enabled</span></div></section>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/platform_admin.js') }}"></script>
</body>
</html>
